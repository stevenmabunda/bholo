<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BHOLO — No connection</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0A0A0A;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      text-align: center;
      padding: 24px;
    }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.25rem; margin: 0; }
    p { margin: 0; color: #a1a1aa; max-width: 320px; font-size: 0.95rem; }
    button {
      margin-top: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #fafafa;
      color: #0A0A0A;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="BHOLO" />
  <h1>No connection</h1>
  <p>BHOLO needs a live connection for the feed, scores and match threads. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>

</html>
